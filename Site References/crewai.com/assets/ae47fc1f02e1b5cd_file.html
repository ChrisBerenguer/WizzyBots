      transform-origin: calc((var(--splash-dot-spacing) * var(--n) * -1) + var(--splash-dot-size)/2) center;

      height: var(--splash-dot-size);
      border-radius: 50%;

      background-color: var(--dot-color);
      filter: saturate(2) opacity(0.85);
      opacity: 0;
    }

ng_hand.png?v=15\\\&quot; title=\\\&quot;:waving_hand:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:waving_hand:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\u003e Hey there everyone!\\u003C/p\u003e\\n\u003cp\u003eI’m incredibly excited to share something we’ve been experimenting with: \u003cstrong\u003ethe early-announcement of the Crews Marketplace!\\u003C/strong\u003e\\u003C/p\u003e\\n\u003cp\u003eWe deeply believe that the strength of CrewAI lies within our community. Now, we want to help amplify your work even further.\\u003C/p\u003e\\n\u003ch3\u003e\u003ca name=\\\&quot;p-8500-why-this-matters-to-you-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-8500-why-this-matters-to-you-1\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\u003e\\u003C/a\u003eWhy This Matters to You:\\u003C/h3\u003e\\n\u003cul\u003e\\n\u003cli\u003e\u003cstrong\u003e\u003cimg src=\\\&quot;https://emoji.discourse-cdn.com/twitter/glowing_star.png?v=15\\\&quot; title=\\\&quot;:glowing_star:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:glowing_star:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\u003e Early Recognition\\u003C/strong\u003e: As some of our earliest and most dedicated community members, you’re first in line to feature your creations and get recognized as leading Crew developers.\\u003C/li\u003e\\n\u003cli\u003e\u003cstrong\u003e\u003cimg src=\\\&quot;https://emoji.discourse-cdn.com/twitter/money_bag.png?v=15\\\&quot; title=\\\&quot;:money_bag:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:money_bag:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\u003e Earn and Grow\\u003C/strong\u003e: We’re rolling out a revenue-sharing model soon, giving you a chance to monetize your templates as they’re adopted by enterprise customers.\\u003C/li\u003e\\n\u003cli\u003e\u003cstrong\u003e\u003cimg src=\\\&quot;https://emoji.discourse-cdn.com/twitter/rocket.png?v=15\\\&quot; title=\\\&quot;:rocket:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:rocket:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\u003e Reach Further\\u003C/strong\u003e: Your crew templates will be showcased to a global audience of enterprise leaders, massively boosting your visibility and influence.\\u003C/li\u003e\\n\\u003C/ul\u003e\\n\u003ch3\u003e\u003ca name=\\\&quot;p-8500-want-to-know-more-2\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#p-8500-want-to-know-more-2\\\&quot; aria-label=\\\&quot;Heading link\\\&quot;\u003e\\u003C/a\u003eWant to know more?\\u003C/h3\u003e\\n\u003caside class=\\\&quot;onebox allowlistedgeneric\\\&quot; data-onebox-src=\\\&quot;https://marketplace.crewai.com\\\&quot;\u003e\\n  \u003cheader class=\\\&quot;source\\\&quot;\u003e\\n      \u003cimg src=\\\&quot;https://us1.discourse-cdn.com/flex025/uploads/crewai/original/2X/0/0fa38024467a49019216e1872a65e7a754b51e88.png\\\&quot; class=\\\&quot;site-icon\\\&quot; alt=\\\&quot;\\\&quot; data-dominant-color=\\\&quot;9D8685\\\&quot; width=\\\&quot;256\\\&quot; height=\\\&quot;256\\\&quot;\u003e\\n\\n      \u003ca href=\\\&quot;https://marketplace.crewai.com\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\u003emarketplace.crewai.com\\u003C/a\u003e\\n  \\u003C/header\u003e\\n\\n  \u003carticle class=\\\&quot;onebox-body\\\&quot;\u003e\\n    \\n\\n\u003ch3\u003e\u003ca href=\\\&quot;https://marketplace.crewai.com\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\u003eCrewAI Enterprise | Submit Your Crew for Evaluation\\u003C/a\u003e\\u003C/h3\u003e\\n\\n  \u003cp\u003eSubmit your custom crew for evaluation and potential inclusion as a template in CrewAI Enterprise\\u003C/p\u003e\\n\\n\\n  \\u003C/article\u003e\\n\\n  \u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\u003e\\n    \\n    \\n  \\u003C/div\u003e\\n\\n  \u003cdiv style=\\\&quot;clear: both\\\&quot;\u003e\\u003C/div\u003e\\n\\u003C/aside\u003e\\n\\n\u003cp\u003e\u003cstrong\u003eMarketplace Official Launch?\\u003C/strong\u003e Q2 2025, but as our inner circle, you’ll hear first.\\u003C/p\u003e\\n\u003cp\u003eI can’t wait to see the amazing crews you’ll build and share. We’re creating something special together—thanks for being on this journey with us.\\u003C/p\u003e\\n\u003cp\u003e\u003cstrong\u003eJoão (Joe)\\u003C/strong\u003e\u003cbr\u003e\\nCEO at CrewAI\\u003C/p\u003e\&quot;,\&quot;key\&quot;:4961,\&quot;url\&quot;:\&quot;https://community.crewai.com/t/big-news-starting-crews-marketplace/4961\&quot;}&quot;,&quot;customEmoji&quot;:&quot;[{\&quot;name\&quot;:\&quot;f55844d48ecd5337\&quot;,\&quot;url\&quot;:\&quot;https://us1.discourse-cdn.com/flex025/uploads/crewai/original/1X/780aec149a4634918e1f93b31ce5e79dc1edea06.gif\&quot;,\&quot;group\&quot;:\&quot;default\&quot;,\&quot;created_by\&quot;:\&quot;matt\&quot;}]&quot;,&quot;isReadOnly&quot;:&quot;false&quot;,&quot;isStaffWritesOnly&quot;:&quot;false&quot;,&quot;activatedThemes&quot;:&quot;{\&quot;4\&quot;:\&quot;Clickable Topic\&quot;,\&quot;14\&quot;:\&quot;Panels\&quot;,\&quot;15\&quot;:\&quot;Primary Button\&quot;,\&quot;16\&quot;:\&quot;Rounded\&quot;,\&quot;18\&quot;:\&quot;Fully Theme\&quot;}&quot;,&quot;upcomingChanges&quot;:&quot;{\&quot;ai_bot_enable_docked_composer\&quot;:false,\&quot;chat_pinned_messages\&quot;:true,\&quot;dashboard_improvements\&quot;:false,\&quot;enable_events_category_type_setup\&quot;:false,\&quot;enable_ideas_category_type_setup\&quot;:true,\&quot;enable_new_checkbox_style\&quot;:false,\&quot;enable_new_defaults_for_trust_level_3_requirements\&quot;:false,\&quot;enable_new_post_reactions_menu\&quot;:true,\&quot;enable_simplified_category_creation\&quot;:true,\&quot;enable_support_category_type_setup\&quot;:true,\&quot;floating_dismiss_topics_on_mobile\&quot;:false,\&quot;modernize_foundation_theme\&quot;:true,\&quot;rename_faq_to_guidelines\&quot;
